<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel - Restaurant Assistant</title>
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface-muted: #f4f1ec;
      --border: #ebe6df;
      --text: #1f1b16;
      --text-muted: #78716c;
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --accent-soft: #fff1e8;
      --radius: 16px;
      --shadow: 0 1px 2px rgba(31, 27, 22, 0.04), 0 8px 24px rgba(31, 27, 22, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 0;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
    }

    header {
      margin-bottom: 1.75rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0.35rem 0 0 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .panel-section {
      margin-bottom: 1.25rem;
      padding: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-section h2 {
      margin: 0 0 1rem 0;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .status-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .status-info p {
      margin: 0;
      padding: 0.9rem 1rem;
      background: var(--surface-muted);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-info strong {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.12);
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.15s ease, transform 0.1s ease;
      flex: 1;
      min-width: 150px;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #d6d3d1;
      cursor: not-allowed;
      transform: none;
    }

    .button-secondary {
      background: var(--text-muted);
    }

    .button-secondary:hover {
      background: var(--text);
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .message.success {
      background: #ecfdf5;
      color: #047857;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .message.loading {
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-label {
      display: block;
      padding: 1.5rem 0.75rem;
      background: var(--surface-muted);
      border: 2px dashed var(--border);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--text-muted);
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    .file-input-wrapper input[type="file"]:focus + .file-input-label {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .file-input-wrapper:hover .file-input-label {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    #file-name {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
    }

    @media (max-width: 600px) {
      .container { padding: 1.5rem 0.75rem; }
      header h1 { font-size: 1.35rem; }
      .status-info { grid-template-columns: 1fr; }
      .button-group { flex-direction: column; }
      button { min-width: auto; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Admin Panel</h1>
      <p>Manage restaurants and upload documents</p>
    </header>

    <!-- Status Section -->
    <div class="panel-section">
      <h2>Current Status</h2>
      <div class="status-info">
        <p><strong>Active Restaurant:</strong> <span id="current-restaurant">Loading...</span></p>
        <p><strong>Menu Items:</strong> <span id="menu-count">Loading...</span></p>
      </div>
    </div>

    <!-- Restaurant Switcher -->
    <div class="panel-section">
      <h2>Switch Restaurant</h2>
      <div class="form-group">
        <label for="restaurant-select">Select Restaurant:</label>
        <select id="restaurant-select">
          <option value="chinese">🥢 Chinese</option>
          <option value="mexican">🌮 Mexican</option>
        </select>
      </div>
      <div id="switch-message"></div>
      <div class="button-group">
        <button id="switch-button">Switch Restaurant</button>
      </div>
    </div>

    <!-- Document Upload Section -->
    <div class="panel-section">
      <h2>Upload Documents</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0 0 1rem 0;">
        Upload text or PDF files to enhance the AI with your restaurant information. Documents are indexed and searchable.
      </p>

      <div class="form-group">
        <label>Select File (TXT or PDF, max 5MB):</label>
        <div class="file-input-wrapper">
          <input type="file" id="file-input" accept=".txt,.pdf" />
          <label for="file-input" class="file-input-label">📁 Choose file or drag & drop</label>
        </div>
        <span id="file-name"></span>
      </div>

      <div class="form-group">
        <label for="restaurant-select-upload">Apply to Restaurant:</label>
        <select id="restaurant-select-upload">
          <option value="shared">🌍 Shared (All Restaurants)</option>
          <option value="chinese">🥢 Chinese Only</option>
          <option value="mexican">🌮 Mexican Only</option>
        </select>
      </div>

      <div class="form-group">
        <label for="admin-password-upload">Admin Password:</label>
        <input type="password" id="admin-password-upload" placeholder="Enter admin password" />
      </div>

      <div id="upload-message"></div>
      <div class="button-group">
        <button id="upload-button" disabled>Upload Document</button>
      </div>
    </div>

    <footer>
      <p><a href="/">← Back to Chat</a></p>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
