[project]
name = "ai-bot-restaurant-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "transformers",
    "torch",
    "pyyaml",
    "pydantic",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
    "azure-keyvault-secrets>=4.11.2",
    "azure-identity>=1.25.3",
    "azure-cosmos>=4.17.1",
    "python-dotenv>=1.2.3",
    "openai>=3.16.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
